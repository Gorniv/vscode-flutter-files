
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm test

      - name: Package VSIX
        run: npm run vsce:package -- --out vscode-flutter-files.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-flutter-files
          path: vscode-flutter-files.vsix
